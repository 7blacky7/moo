[tools]
python = "3.13"

[tasks.p4-build-compiler]
description = "Compile the Moo compiler for P4 without running training or tests"
run = "cargo build --manifest-path compiler/Cargo.toml --release --locked --no-default-features"

[tasks.dev]
description = "Run moo REPL"
run = "uv run python -m moo"

[tasks.test]
description = "Run tests"
run = "uv run pytest tests/ -v"

[tasks.run]
description = "Run a .moos file"
run = "uv run python -m moo run"

[tasks.test-compiler]
description = "Run compiler test suite"
run = "bash compiler/tests/run_all.sh"

[tasks.test-ui]
description = "Run visual UI tests in the isolated harness"
run = "bash scripts/ui-test-runner.sh"

[tasks.test-native-ui-beweis]
description = "NATIVE-UI-5: honest visible non-GTK Wayland proof (ldd + backend name + window-only screenshot; needs real display)"
run = '''
set -eu
OUT="${MOO_BEWEIS_ROOT:-/tmp/moo-native-beweis}"
mkdir -p "$OUT"
cargo build --release --manifest-path compiler/Cargo.toml --no-default-features --features wayland_ui
TARGET="${CARGO_TARGET_DIR:-$PWD/compiler/target}"
case "$TARGET" in
  /*) ;;
  *) TARGET="$PWD/$TARGET" ;;
esac
COMPILER="$TARGET/release/moo-compiler"
"$COMPILER" compile beispiele/moo_aero_csd_host.moos -o "$OUT/aero"
MOO_BEWEIS_BACKEND=wayland MOO_BEWEIS_OUT="$OUT" bash scripts/native-ui-beweis.sh "$OUT/aero"
'''

[tasks.test-native-ui-widgets-beweis]
description = "Visible non-GTK ui_moo widget proof with a retained window-only screenshot"
run = '''
set -eu
OUT="${MOO_WIDGET_BEWEIS_ROOT:-/tmp/moo-widget-beweis}"
mkdir -p "$OUT"
cargo build --release --manifest-path compiler/Cargo.toml --no-default-features --features wayland_ui
TARGET="${CARGO_TARGET_DIR:-$PWD/compiler/target}"
case "$TARGET" in
  /*) ;;
  *) TARGET="$PWD/$TARGET" ;;
esac
COMPILER="$TARGET/release/moo-compiler"
"$COMPILER" compile beispiele/moo_widgets_host.moos -o "$OUT/widgets"
MOO_BEWEIS_BACKEND=wayland MOO_BEWEIS_OUT="$OUT" bash scripts/native-ui-beweis.sh "$OUT/widgets"
echo "WIDGET-BEWEIS-FESTER-PFAD $OUT/beweis.png"
'''
[tasks.test-ui-host-contract]
description = "Host backend contract gate: vtable completeness + registry, toolkit-free (ASan+UBSan)"
run = '''
set -eu
OUT="$(mktemp -d "${TMPDIR:-/tmp}/moo-ui-host.XXXXXX")"
trap 'rm -rf "$OUT"' EXIT
CC="${CC:-cc}"
"$CC" -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer -DMOO_UI_HOST_OHNE_DISPATCHER -Icompiler/runtime compiler/runtime/tests/test_ui_host_contract.c compiler/runtime/moo_ui_host.c -o "$OUT/contract"
ASAN_OPTIONS=detect_leaks=1:abort_on_error=1 "$OUT/contract"
'''

[tasks.test-ui-moo-demo]
description = "Run the ui_moo demo 20 times in the isolated harness"
run = "bash scripts/ui-moo-demo-smoke.sh"

[tasks.test-ui-moo-lifecycle]
description = "Run the toolkit-free headless ui_moo lifecycle and callback ownership gates"
run = '''
set -eu
OUT="$(mktemp -d "${TMPDIR:-/tmp}/moo-ui-moo-lifecycle.XXXXXX")"
trap 'rm -rf "$OUT"' EXIT
cargo build --release --manifest-path compiler/Cargo.toml
TARGET="${CARGO_TARGET_DIR:-$PWD/compiler/target}"
case "$TARGET" in
  /*) ;;
  *) TARGET="$PWD/$TARGET" ;;
esac
COMPILER="$TARGET/release/moo-compiler"
"$COMPILER" compile beispiele/tests/ui_moo_lifecycle_test.moos -o "$OUT/lifecycle"
env -u DISPLAY -u WAYLAND_DISPLAY -u XDG_RUNTIME_DIR -u DBUS_SESSION_BUS_ADDRESS \
    -u PULSE_SERVER -u PIPEWIRE_REMOTE -u XAUTHORITY \
    MOO_UI_BACKEND=gtk "$OUT/lifecycle"
'''


