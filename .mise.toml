[tasks.p6-parser-bpe-test]
description = "Parser-BPE ASan/UBSan und Moo-Sprachtest"
run = '''
set -eu
P6_OUT="$(mktemp -d "${TMPDIR:-/tmp}/moo-parser-bpe.XXXXXX")"
trap 'rm -rf "$P6_OUT"' EXIT
P6_DIR=compiler/runtime
P6_BASE="$P6_DIR/moo_quant.c $P6_DIR/moo_tensor.c $P6_DIR/moo_tensor_ops.c $P6_DIR/moo_ki_gpu.c $P6_DIR/moo_autograd.c $P6_DIR/moo_memory.c $P6_DIR/moo_value.c $P6_DIR/moo_print.c $P6_DIR/moo_string.c $P6_DIR/moo_dict.c $P6_DIR/moo_list.c $P6_DIR/moo_ops.c"
for P6_MODE in address undefined; do
  "${CC:-cc}" -std=gnu11 -D_GNU_SOURCE -g -O1 "-fsanitize=$P6_MODE" -fno-sanitize-recover=undefined -fno-omit-frame-pointer "$P6_DIR/tests/test_tokenizer_parser_asan.c" "$P6_DIR/tests/capture_free_stubs.c" "$P6_DIR/moo_tokenizer.c" "$P6_DIR/moo_tok_segment.c" "$P6_DIR/moo_silben.c" "$P6_DIR/moo_krypto.c" $P6_BASE -lm -o "$P6_OUT/test"
  ASAN_OPTIONS=detect_leaks=1:abort_on_error=1 UBSAN_OPTIONS=halt_on_error=1 "$P6_OUT/test"
done
compiler/target/release/moo-compiler compile beispiele/tests/p4_parser_bpe.moos -o "$P6_OUT/moos-test"
MOO_KI_GPU=0 P4_PARSER_TOKENIZER_PFAD="$P6_OUT/parser.mbt" "$P6_OUT/moos-test"
'''

