[tasks.test-p5-optimierer-paritaet]
description = "Compare CPU and strict Vulkan optimizer parameters and resume"
run = '''
set -eu
P5_TEST_DIR="$(mktemp -d)"
trap 'rm -rf "$P5_TEST_DIR"' EXIT
export P5_TEST_DIR
compiler/target/release/moo-compiler compile beispiele/p5/optimierer_resume_test.moos -o "$P5_TEST_DIR/test"
MOO_KI_GPU=0 MOO_KI_GPU_ERZWINGEN=0 MOO_KI_GPU_STRIKT=0 "$P5_TEST_DIR/test" > "$P5_TEST_DIR/cpu"
MOO_KI_GPU=1 MOO_KI_GPU_ERZWINGEN=1 MOO_KI_GPU_STRIKT=1 "$P5_TEST_DIR/test" > "$P5_TEST_DIR/vulkan"
uv run python - "$P5_TEST_DIR/cpu" "$P5_TEST_DIR/vulkan" <<'P5PY'
import json, math, sys
def read(path):
    rows = {}
    with open(path, encoding="utf-8") as f:
        for line in f:
            if line.startswith("P5 PARAM "):
                _, _, art, index, data = line.strip().split(" ", 4)
                key = (art, index)
                if key in rows:
                    raise SystemExit("duplicate parameter")
                rows[key] = json.loads(data)
    return rows
a, b = map(read, sys.argv[1:])
if len(a) != 8 or a.keys() != b.keys():
    raise SystemExit("parameter set mismatch")
n = 0
for key in a:
    if len(a[key]) != len(b[key]):
        raise SystemExit("parameter length mismatch")
    for x, y in zip(a[key], b[key]):
        if not (math.isfinite(x) and math.isfinite(y) and math.isclose(x, y, rel_tol=1e-5, abs_tol=1e-5)):
            raise SystemExit("CPU/Vulkan mismatch: " + str(key))
        n += 1
print("P5 OPT PARITY OK", len(a), "parameter tensors,", n, "values")
P5PY
'''

