set -eu
P4_DIAG="$PWD/beispiele/p4_silben/run_sil11_fix_20261030/bpe47_instrumentiert"
test ! -e "$P4_DIAG/train_paritaet_instrumentiert"
compiler/target/release/moo-compiler compile beispiele/p4_silben/train_paritaet_instrumentiert.moos -o "$P4_DIAG/train_paritaet_instrumentiert"
'''

[tasks.p4-bpe47-instrument-run]
description = "Run the single authorised instrumented BPE parity experiment"
run = "uv run python -m skripte.p4_silben.bpe47_instrumentiert"


[tasks.p4-instrument-step]
description = "Run one budgeted instrumented train or validation step"
run = '''
set -eu
: "${P4_INST_ACTION:?set train or val}"
: "${P4_INST_VARIANT:?set tokenizer}"
: "${P4_INST_SEED:?set seed}"
uv run python -m skripte.p4_silben.fix_instrument_step "$P4_INST_ACTION" "$P4_INST_VARIANT" "$P4_INST_SEED"
'''


[tasks.p4-instrument-freeze]
description = "Freeze the nine instrumented validation results"
run = "uv run python -m skripte.p4_silben.fix_instrument_final freeze"

[tasks.p4-instrument-test]
description = "Evaluate one frozen test report once"
run = '''
set -eu
: "${P4_INST_VARIANT:?set tokenizer}"
: "${P4_INST_SEED:?set seed}"
uv run python -m skripte.p4_silben.fix_instrument_final test "$P4_INST_VARIANT" "$P4_INST_SEED"
'''

[tasks.p4-instrument-summary]
description = "Compare completed P4 reports with uniform-token baseline"
run = "uv run python -m skripte.p4_silben.fix_instrument_final summary"
