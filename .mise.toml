${CXX:-c++} -std=c++17 -O2 -Wall -Wextra -Werror -pedantic -c skripte/p2/abi/cpp_adapter.cpp -o build/p2-abi/cpp_adapter.o
${CXX:-c++} build/p2-abi/cpp_adapter_test.o build/p2-abi/cpp_adapter.o -o build/p2-abi/cpp_adapter_test
build/p2-abi/cpp_adapter_test
'''

[tasks.p2-ffi-negativ]
description = "P2: extern-C negative Compiletests"
run = '''
set -eu
mkdir -p build/p2-abi
for name in ffi_aufruf_ausgeschlossen ffi_symbolkollision ffi_varargs ffi_aggregat; do
  source="compiler/tests/p2/${name}.moos"
  expected="compiler/tests/p2/${name}.expected_error"
  log="build/p2-abi/${name}.log"
  test -s "$expected"
  set +e
  timeout 30s compiler/target/release/moo-compiler compile "$source" --emit-ir -o "build/p2-abi/${name}.ll" >"$log" 2>&1
  rc=$?
  set -e
  if [ "$rc" -eq 0 ] || [ "$rc" -eq 124 ] || [ "$rc" -ge 128 ]; then
    printf 'FAIL %s: unerwarteter Exit %s\n' "$name" "$rc"
    exit 1
  fi
  if ! rg -q -F -f "$expected" "$log"; then
    printf 'FAIL %s: erwartete Diagnose fehlt\n' "$name"
    exit 1
  fi
  printf 'PASS %s\n' "$name"
done
'''

