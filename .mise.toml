[tasks.test-p5-kontrastiv-paritaet]
description = "Compare InfoNCE gradients on CPU and strict Vulkan"
run = '''
set -eu
P5_OUT="$(mktemp -d)"
trap 'rm -rf "$P5_OUT"' EXIT
compiler/target/release/moo-compiler compile beispiele/p5/kontrastiv_paritaet.moos -o "$P5_OUT/test"
MOO_KI_GPU=0 MOO_KI_GPU_ERZWINGEN=0 MOO_KI_GPU_STRIKT=0 "$P5_OUT/test" > "$P5_OUT/cpu"
MOO_KI_GPU=1 MOO_KI_GPU_ERZWINGEN=1 MOO_KI_GPU_STRIKT=1 "$P5_OUT/test" > "$P5_OUT/gpu"
uv run python - "$P5_OUT/cpu" "$P5_OUT/gpu" <<'P5PY'
import json, math, sys
def read(path):
    with open(path, encoding="utf-8") as f:
        rows = [s.strip()[8:].split(" ", 1) for s in f if s.startswith("P5 INFO ")]
    if len(rows)!=1: raise SystemExit("missing gradient output")
    return [json.loads(s) for s in rows[0]]
a,b=map(read,sys.argv[1:])
if len(a)!=2 or len(b)!=2: raise SystemExit("gradient group mismatch")
n=0
for x,y in zip(a,b):
    if len(x)!=9 or len(y)!=9: raise SystemExit("gradient size mismatch")
    for p,q in zip(x,y):
        if not (math.isfinite(p) and math.isfinite(q) and math.isclose(p,q,rel_tol=1e-4,abs_tol=1e-5)):
            raise SystemExit("InfoNCE gradient mismatch")
        n+=1
if not any(abs(x)>1e-6 for row in a for x in row): raise SystemExit("zero gradient")
print("P5 INFO PARITY OK",n,"values")
P5PY
'''

