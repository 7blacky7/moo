test -x "$P4_COMPILER"
cat > "$P4_OUT/alias.moos" <<'MOO_P4_ALIAS'
setze muster auf datei_lesen("compiler/runtime/data/silben/dehyphn-x-2024-02-28.pat")
setze z auf char_fixed_train("Wald", 260)
setze s auf syllable_train("Wald", 260, muster)
wenn char_fixed_decode(z, char_fixed_encode(z, "Wald")) != "Wald":
    wirf "Zeichenalias"
wenn syllable_decode(s, syllable_encode(s, "Wald")) != "Wald":
    wirf "Silbenalias"
zeige "P4 ALIAS OK"
MOO_P4_ALIAS
"$P4_COMPILER" compile "$P4_OUT/alias.moos" -o "$P4_OUT/alias"
"$P4_OUT/alias" > "$P4_OUT/output"
grep -qx 'P4 ALIAS OK' "$P4_OUT/output"
printf '%s\n' 'zeige syllable_train("Wald", 260)' > "$P4_OUT/bad.moos"
if "$P4_COMPILER" compile "$P4_OUT/bad.moos" -o "$P4_OUT/bad" > "$P4_OUT/bad.log" 2>&1; then
    echo "FAIL: falsche Argumentanzahl akzeptiert" >&2
    exit 1
fi
grep -q 'erwartet 3 Argument' "$P4_OUT/bad.log"
cat "$P4_OUT/output"
echo "P4 ARITY OK"
'''


