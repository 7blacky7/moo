[tasks.p4-compile-experiment]
description = "Compile SIL-11 programs into an existing private run directory without training"
run = '''
set -eu
umask 077
: "${P4_RUN_DIR:?P4_RUN_DIR must name an existing private run directory}"
case "$P4_RUN_DIR" in /*) ;; *) echo "P4_RUN_DIR must be absolute" >&2; exit 1;; esac
if [ ! -d "$P4_RUN_DIR" ] || [ -L "$P4_RUN_DIR" ]; then
  echo "P4_RUN_DIR must be a real directory" >&2; exit 1
fi
test "$(realpath -e "$P4_RUN_DIR")" = "$P4_RUN_DIR"
test "$(stat -c %u "$P4_RUN_DIR")" = "$(id -u)"
test "$(stat -c %a "$P4_RUN_DIR")" = 700
P4_COMPILER="${P4_COMPILER:-$PWD/compiler/target/release/moo-compiler}"
test -x "$P4_COMPILER"
for P4_NAME in train_tokenizers init_model encode logits logits_batch train_window; do
  if [ -e "$P4_RUN_DIR/$P4_NAME" ] || [ -L "$P4_RUN_DIR/$P4_NAME" ]; then
    echo "P4 output already exists: $P4_NAME" >&2; exit 1
  fi
done
sha256sum "$P4_COMPILER"
for P4_NAME in train_tokenizers init_model encode logits logits_batch train_window; do
  sha256sum "beispiele/p4_silben/$P4_NAME.moos"
  "$P4_COMPILER" compile "beispiele/p4_silben/$P4_NAME.moos" -o "$P4_RUN_DIR/$P4_NAME"
  sha256sum "$P4_RUN_DIR/$P4_NAME"
done
'''


