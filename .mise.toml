description = "Run existing dataset, BPE, shard and checkpoint native regression harnesses"
run = '''
set -eu
P4_OUT="$(mktemp -d "${TMPDIR:-/tmp}/moo-p4-regression.XXXXXX")"
trap 'rm -rf "$P4_OUT"' EXIT
P4_CC="${CC:-cc}"
P4_DIR="compiler/runtime"
P4_BASE="$P4_DIR/moo_quant.c $P4_DIR/moo_tensor.c $P4_DIR/moo_tensor_ops.c $P4_DIR/moo_ki_gpu.c $P4_DIR/moo_autograd.c $P4_DIR/moo_memory.c $P4_DIR/moo_value.c $P4_DIR/moo_print.c $P4_DIR/moo_string.c $P4_DIR/moo_dict.c $P4_DIR/moo_list.c $P4_DIR/moo_ops.c"
for P4_MODE in address undefined; do
  for P4_KIND in dataset tokenizer shard checkpoint; do
    case "$P4_KIND" in
      dataset) P4_EXTRA="$P4_DIR/moo_dataset.c" ;;
      tokenizer) P4_EXTRA="$P4_DIR/moo_tokenizer.c" ;;
      shard) P4_EXTRA="$P4_DIR/moo_shard.c" ;;
      checkpoint) P4_EXTRA="$P4_DIR/moo_nn.c $P4_DIR/moo_nn_easy.c $P4_DIR/moo_json.c" ;;
    esac
    echo "P4_REGRESSION build=$P4_KIND sanitizer=$P4_MODE"
    "$P4_CC" -std=gnu11 -D_GNU_SOURCE -g -O1 "-fsanitize=$P4_MODE" -fno-sanitize-recover=undefined -fno-omit-frame-pointer "$P4_DIR/tests/test_${P4_KIND}_asan.c" "$P4_DIR/tests/capture_free_stubs.c" $P4_EXTRA $P4_BASE -lm -o "$P4_OUT/$P4_KIND"
    ASAN_OPTIONS=detect_leaks=1:abort_on_error=1 UBSAN_OPTIONS=halt_on_error=1 "$P4_OUT/$P4_KIND"
  done
done
'''


[tasks.test-p4-alias]
