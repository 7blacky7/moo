
[tasks.defer-handler-diagnose]
description = "P2 Frontend: lokaler Cleanup-Catch und Handler-Tiefe diagnostisch"
dir = "{{config_root}}/../../.."
run = '''
set -eu
out=build/p2-frontend/defer_handler
mkdir -p "$out"
timeout 30s compiler/target/release/moo-compiler compile compiler/tests/p2/defer_handler_tiefe.moos -o "$out/probe"
set +e
timeout 10s "$out/probe" > "$out/probe.out" 2> "$out/probe.err"
rc=$?
set -e
echo "Diagnose-Exit: $rc"
echo "stdout:"
cat "$out/probe.out"
echo "stderr:"
cat "$out/probe.err"
if [ "$rc" -eq 124 ] || [ "$rc" -ge 128 ]; then exit 1; fi
'''

[tasks.expect-heap]
description = "P2 Frontend: Expect-Temporaries und RSS"
