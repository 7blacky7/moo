[tasks.testframe-cleanup-heap]
description = "P2 Frontend: Cleanup liest Test-Heaplokal"
dir = "{{config_root}}/../../.."
run = '''
set -eu
out=build/p2-frontend/testframe_cleanup_heap
mkdir -p "$out"
timeout 30s compiler/target/release/moo-compiler compile compiler/tests/p2/testframe_cleanup_heap.moos -o "$out/probe"
timeout 30s "$out/probe" > "$out/probe.out" 2> "$out/probe.err"
awk '
  $0 == "L_OK" {if (s != 0) exit 1; s=1; next}
  s == 1 {if ($0 != "4") exit 1; s=2; next}
  $0 == "    OK" {if (s != 2) exit 1; s=3; next}
  /FEHLGESCHLAGEN: Erwartung nicht erfuellt/ {if (s != 3) exit 1; s=4; next}
  $0 == "L_FAIL" {if (s != 4) exit 1; s=5; next}
  s == 5 {if ($0 != "4") exit 1; s=6; next}
  $0 == "    FAIL" {if (s != 6) exit 1; s=7; next}
  END {if (s != 7) exit 1}
' "$out/probe.out"
echo "PASS Cleanup liest Heaplokal vor Slot-Freigabe"
'''

