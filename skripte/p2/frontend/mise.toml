[tasks.negativ]
description = "P2 Frontend: native Parser- und Import-Negativtests"
dir = "{{config_root}}/../../.."
run = '''
set -eu
mkdir -p build/p2-frontend
for name in exponent_gueltig exponent_fehlt exponent_vorzeichen_fehlt exponent_ungueltig import_struktur_kollision import_ffi_kollision m1_typ_parameter_fehlt m1_typ_rueckgabe_fehlt m1_lokal_typkonflikt m1_lokal_unbekannt struktur_feld_doppelt struktur_typ_unbekannt struktur_array_null dataclass_typ_fehlt bibliothek_named_fehler decorator_named_fremd; do
  source="compiler/tests/p2/${name}.moos"
  expected="compiler/tests/p2/${name}.expected_error"
  log="build/p2-frontend/${name}.log"
  test -s "$expected"
  set +e
  timeout 30s compiler/target/release/moo-compiler compile "$source" --emit-ir -o "build/p2-frontend/${name}.ll" >"$log" 2>&1
  rc=$?
  set -e
  if [ "$rc" -eq 0 ] || [ "$rc" -eq 124 ] || [ "$rc" -ge 128 ]; then
    printf 'FAIL %s: unerwarteter Exit %s\n' "$name" "$rc"
    exit 1
  fi
  if ! rg -q -F -f "$expected" "$log"; then
    printf 'FAIL %s: erwartete Diagnose fehlt\n' "$name"
    exit 1
  fi
  printf 'PASS %s\n' "$name"
done
'''
