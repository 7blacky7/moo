[tasks.guard-fallback]
description = "P2 Frontend: Guard-Fallback in Funktion und main"
dir = "{{config_root}}/../../.."
run = '''
set -u
out=build/p2-frontend/guard_fallback
mkdir -p "$out"
failed=0
for name in main funktion; do
  timeout 30s compiler/target/release/moo-compiler compile "compiler/tests/p2/guard_fallback_${name}.moos" -o "$out/$name" > "$out/$name.compile.log" 2>&1
  rc=$?
  if [ "$rc" -ne 0 ]; then echo "FAIL $name: Compile-Exit $rc"; failed=1; continue; fi
  timeout 10s "$out/$name" > "$out/$name.out" 2> "$out/$name.err"
  rc=$?
  if [ "$rc" -ne 0 ] || ! cmp -s "compiler/tests/p2/guard_fallback_${name}.expected" "$out/$name.out"; then
    echo "FAIL $name: Exit/Ausgabe (Exit $rc)"; failed=1
  else
    echo "PASS $name"
  fi
done
exit "$failed"
'''

[tasks.defer-testframe]
description = "P2 Frontend: Defer bei Test-Fallthrough und erwarte-Fehler"
dir = "{{config_root}}/../../.."
run = '''
set -eu
out=build/p2-frontend/defer_testframe
mkdir -p "$out"
timeout 30s compiler/target/release/moo-compiler compile compiler/tests/p2/defer_testframe.moos -o "$out/probe"
timeout 30s "$out/probe" > "$out/probe.out" 2> "$out/probe.err"
awk '
  $0 == "BODY_OK" {if (s != 0) exit 1; s=1; next}
  $0 == "CLEANUP_OK" {if (s != 1) exit 1; s=2; next}
  $0 == "    OK" {if (s != 2) exit 1; s=3; next}
  $0 == "BODY_FAIL" {if (s != 3) exit 1; s=4; next}
  /FEHLGESCHLAGEN: Erwartung nicht erfuellt/ {if (s != 4) exit 1; s=5; next}
  $0 == "CLEANUP_FAIL" {if (s != 5) exit 1; s=6; next}
  $0 == "    FAIL" {if (s != 6) exit 1; s=7; next}
  $0 == "NACH_FALSCH" {exit 1}
  END {if (s != 7) exit 1}
' "$out/probe.out"
echo "PASS Test-Frame-Defer und Fehlerdiagnose"
'''

