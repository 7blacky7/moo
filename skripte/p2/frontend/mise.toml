[tasks.defer-katalog]
description = "P2 Frontend: Defer-Katalog Compile-Smoke"
dir = "{{config_root}}/../../.."
run = '''
set -eu
mkdir -p build/p2-frontend/defer_katalog
failed=0
for name in funktion methode test main; do
  out="build/p2-frontend/defer_katalog/$name"
  if timeout 30s compiler/target/release/moo-compiler compile "compiler/tests/p2/defer_katalog_${name}.moos" --emit-ir -o "$out.ll" > "$out.log" 2>&1 && timeout 30s mise exec -- opt -passes=verify -disable-output "$out.ll"; then
    echo "PASS $name"
  else
    echo "FAIL $name"
    cat "$out.log"
    failed=1
  fi
done
exit "$failed"
'''

