out=build/p10-t4
compiler="${MOO_COMPILER:-compiler/target/release/moo-compiler}"
mkdir -p "$out"
"$compiler" compile compiler/tests/p2/pro_kern.moos -o "$out/pro_kern"
"$out/pro_kern" > "$out/hosted.out"
diff -u compiler/tests/p2/pro_kern.expected "$out/hosted.out"
for target in x86_64-bare x86_64-unknown-uefi; do
    "$compiler" compile compiler/tests/p2/pro_kern_lib.moos --no-stdlib --target "$target" --emit-ir -o "$out/$target.ll"
    mise exec -- opt -passes=verify -disable-output "$out/$target.ll"
    rg -q 'addrspace\(256\)' "$out/$target.ll"
    rg -q 'section ".moo_prokern"' "$out/$target.ll"
    if rg -q '@__moo_prokern_vorlage = thread_local' "$out/$target.ll"; then
        echo 'FAIL Bare/UEFI-Vorlage als hosted TLS'; exit 1
    fi
    mise exec -- llc -filetype=obj "$out/$target.ll" -o "$out/$target.o"
done
mise exec -- llvm-objdump -d "$out/x86_64-bare.o" > "$out/bare.asm"
rg -q '%gs:0x8' "$out/bare.asm"
rg -q '%gs:0x20' "$out/bare.asm"
rg -q 'rdmsr' "$out/bare.asm"
mise exec -- llvm-extract -S --glob=__moo_prokern_vorlage --func=__moo_native.pro_lesen "$out/x86_64-bare.ll" -o "$out/bild.ll"
mise exec -- llc -filetype=obj "$out/bild.ll" -o "$out/bild.o"
mise exec -- ld.lld -T beispiele/kernel/linker-uefi.ld --entry=__moo_native.pro_lesen --gc-sections "$out/bild.o" -o "$out/bild.elf"
mise exec -- llvm-nm -n --defined-only "$out/bild.elf" > "$out/bild.sym"
anfang="$(awk '$3 == "__moo_prokern_anfang" {print $1}' "$out/bild.sym")"
ende="$(awk '$3 == "__moo_prokern_ende" {print $1}' "$out/bild.sym")"
[ -n "$anfang" ] && [ -n "$ende" ]
[ "$((0x$ende - 0x$anfang))" = 40 ]
[ "$((0x$anfang % 64))" = 0 ]
for name in unsicher konstante; do
    if "$compiler" compile "compiler/tests/p2/pro_kern_$name.moos" --emit-ir -o "$out/neg.ll" > "$out/$name.log" 2>&1; then
        echo "FAIL pro_kern $name akzeptiert"; exit 1
    fi
done
rg -q 'unsicher' "$out/unsicher.log"
rg -q 'verlangt.*statisch' "$out/konstante.log"
if "$compiler" compile compiler/tests/p2/pro_kern_lib.moos --no-stdlib --target aarch64-bare --emit-ir -o "$out/arm.ll" > "$out/arm.log" 2>&1; then
    echo 'FAIL nicht implementiertes CPU-lokales ARM-Backend akzeptiert'; exit 1
fi
rg -q '@pro_kern ist derzeit nur fuer x86_64' "$out/arm.log"
echo 'PASS pro_kern: getrennte Hosted-Threads, GS-Offsets, UEFI und Diagnosegrenzen'
'''

[tasks.bitfeld]
description = "P10-T5: Bitbereichsregeln, GDT-Konstante, fangbarer Overflow und Deskriptororakel"
run = '''
set -eu
cd ../../..
out=build/p10-t5
compiler="${MOO_COMPILER:-compiler/target/release/moo-compiler}"
mkdir -p "$out"
"$compiler" compile compiler/tests/p2/bitfeld.moos -o "$out/bitfeld"
"$out/bitfeld" > "$out/hosted.out"
diff -u compiler/tests/p2/bitfeld.expected "$out/hosted.out"
for name in ueberlappung basis wert_falsch adresse; do
    if "$compiler" compile "compiler/tests/p2/bitfeld_$name.moos" --emit-ir -o "$out/neg.ll" > "$out/$name.log" 2>&1; then
        echo "FAIL bitfeld $name akzeptiert"; exit 1
    fi
done
rg -q 'ueberlappt' "$out/ueberlappung.log"
rg -q 'Basisbreite' "$out/basis.log"
rg -q 'passt nicht in 3 Bit' "$out/wert_falsch.log"
rg -q 'Bitbereich ohne eigene Byteadresse' "$out/adresse.log"
for target in x86_64-bare x86_64-unknown-uefi; do
    "$compiler" compile stdlib/nativ_x86_deskriptoren.moos --no-stdlib --target "$target" --emit-ir -o "$out/$target.ll"
    mise exec -- opt -passes=verify -disable-output "$out/$target.ll"
    rg -q '@X86_GDT_CODE = constant.*49427445715107839' "$out/$target.ll"
    mise exec -- llvm-extract -S --func=__moo_native.x86_tss_unterwort --func=__moo_native.x86_tss_oberwort --func=__moo_native.x86_idt_unterwort --func=__moo_native.x86_idt_oberwort "$out/$target.ll" -o "$out/$target.extract.ll"
    mise exec -- llc -O2 -filetype=obj "$out/$target.extract.ll" -o "$out/$target.o"
done
${CXX:-c++} -std=c++17 -Wall -Wextra -Werror compiler/tests/p2/bitfeld_probe.cpp "$out/x86_64-bare.o" -o "$out/orakel"
"$out/orakel"
echo 'PASS bitfeld: GDT/Native/Hosted, Bereichsdiagnosen und TSS/IDT-Wortvergleich'
'''

[tasks.trampolin]
description = "P10-T6: verschiebbare ASM-Sektionen, echte Grenzen, i8086-Bytes und Relokationsdiagnosen"
run = '''
set -eu
cd ../../..
out=build/p10-t6
compiler="${MOO_COMPILER:-compiler/target/release/moo-compiler}"
mkdir -p "$out"
for target in x86_64-bare x86_64-unknown-uefi; do
    "$compiler" compile skripte/p8/smp/assembler_modus_probe.moos --no-stdlib --target "$target" --emit-ir -o "$out/$target.ll"
    mise exec -- opt -passes=verify -disable-output "$out/$target.ll"
    mise exec -- llvm-extract -S --func=probe_assembler_modus --func=__moo_native.probe_trampolin_anfang --func=__moo_native.probe_trampolin_ende "$out/$target.ll" -o "$out/$target.extract.ll"
    mise exec -- llc -filetype=obj "$out/$target.extract.ll" -o "$out/$target.o"
done
mise exec -- llvm-readelf -rW "$out/x86_64-bare.o" > "$out/relokationen.txt"
if rg -q '\.rela\.moo_ap_trampolin' "$out/relokationen.txt"; then
    echo 'FAIL Symbolfixup im kopierten Modusabschnitt'; exit 1
fi
${CXX:-c++} -std=c++17 -Wall -Wextra -Werror -no-pie compiler/tests/p7/hardware/trampolin_probe.cpp "$out/x86_64-bare.o" -o "$out/orakel"
"$out/orakel" "$out/kopie.bin"
objdump -D -b binary -m i8086 "$out/kopie.bin" > "$out/i8086.asm"
rg -q '66 89 c3' "$out/i8086.asm"
"$compiler" compile compiler/tests/p7/hardware/trampolin_lokal.moos --no-stdlib --target x86_64-bare --emit-ir -o "$out/lokal.ll"
mise exec -- opt -passes=verify -disable-output "$out/lokal.ll"
mise exec -- llvm-extract -S --func=__moo_native.tramp_lokal "$out/lokal.ll" -o "$out/lokal.extract.ll"
mise exec -- llc -filetype=obj "$out/lokal.extract.ll" -o "$out/lokal.o"
mise exec -- llvm-readelf -rW "$out/lokal.o" > "$out/lokal-relokationen.txt"
if rg -q '\.rela\.moo_ap_lokal' "$out/lokal-relokationen.txt"; then
    echo 'FAIL lokale Differenz erzeugt Symbolfixup'; exit 1
fi
mise exec -- llvm-objcopy --dump-section=".moo_ap_lokal=$out/lokal.bin" "$out/lokal.o"
hex="$(od -An -tx1 -N5 "$out/lokal.bin" | tr -d '[:space:]')"
[ "$hex" = eb020400c3 ]
for name in absolut absolut_lokal direktive zitiert doppelt unbekannt nackt_fehlt; do
    if "$compiler" compile "compiler/tests/p7/hardware/trampolin_$name.moos" --no-stdlib --target x86_64-bare --emit-ir -o "$out/neg.ll" > "$out/$name.log" 2>&1; then
        echo "FAIL Trampolin $name akzeptiert"; exit 1
    fi
done
rg -q 'absoluter oder externer Symbolbezug' "$out/absolut.log"
rg -q 'absoluter oder externer Symbolbezug' "$out/absolut_lokal.log"
rg -q 'Direktive.*nicht erlaubt' "$out/direktive.log"
rg -q 'zitierte Symbole' "$out/zitiert.log"
rg -q 'bereits belegt' "$out/doppelt.log"
rg -q 'keine deklarierte.*Sektion' "$out/unbekannt.log"
rg -q '@verschiebbar verlangt @nackt' "$out/nackt_fehlt.log"
echo 'PASS Trampolin: Bare/UEFI, sechs kopierte Bytes, lokale Relativmarken, sieben Diagnosen'
'''
