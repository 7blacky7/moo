name: 3D Backend Smoke

on:
  pull_request:
    paths:
      - "compiler/src/**"
      - "compiler/runtime/**"
      - "compiler/Cargo.toml"
      - "compiler/build.rs"
      - "stdlib/welt.moos"
      - "beispiele/domain/game/world/welt_test.moos"
      - ".github/workflows/3d-backends.yml"
  push:
    branches: [master, main]
    paths:
      - ".github/workflows/3d-backends.yml"
      - ".cargo/**"
      - "compiler/.cargo/**"
      - "compiler/Cargo.toml"
      - "compiler/Cargo.lock"
      - "compiler/build.rs"
      - "compiler/build_aritaet.rs"
      - "compiler/src/**"
      - "compiler/runtime/**"
      # build.rs kann auf Nicht-Windows-Hosts auch das MinGW-Archiv bauen.
      - "skripte/p2/windows_minipc/runtime_mingw.sh"
      - "skripte/p2/windows_minipc/db_abwesend.c"
      - "beispiele/domain/game/world/welt_test.moos"
      - "stdlib/welt.moos"

jobs:
  build-smoke:
    strategy:
      fail-fast: false
      matrix:
        backend: [gl21, gl33, vulkan]
        include:
          - backend: vulkan
            allow_fail: true
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.allow_fail == true }}
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 22 + 3D runtime deps
        run: |
          # LLVM 22 aus apt.llvm.org (Ubuntu liefert nur bis 18/19/20).
          . /etc/os-release
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/${VERSION_CODENAME}/ llvm-toolchain-${VERSION_CODENAME}-22 main" | sudo tee /etc/apt/sources.list.d/llvm-22.list >/dev/null
          sudo apt-get update
          # Keep LLVM in sync with compiler/Cargo.toml (inkwell llvm22-1 / llvm-sys 221).
          # Core runtime files built by the compiler also require curl/sqlite/SDL2 headers.
          sudo apt-get install -y \
            llvm-22-dev libpolly-22-dev libclang-22-dev \
            libglfw3-dev libgl1-mesa-dev \
            libsdl2-dev libsdl2-image-dev \
            libcurl4-openssl-dev libsqlite3-dev \
            pkg-config
          echo "LLVM_SYS_221_PREFIX=/usr/lib/llvm-22" >> $GITHUB_ENV
          echo "LLVM_SYS_221_STRICT_VERSIONING=1" >> $GITHUB_ENV
          echo "LIBCLANG_PATH=/usr/lib/llvm-22/lib" >> $GITHUB_ENV

      - name: Install Vulkan toolchain
        if: matrix.backend == 'vulkan'
        run: |
          sudo apt-get install -y libvulkan-dev glslang-tools

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo build (--features ${{ matrix.backend }})
        working-directory: compiler
        run: cargo build --release --no-default-features --features ${{ matrix.backend }}

      - name: Moo-Compile welt_test.moos (--emit-ir)
        run: |
          ./compiler/target/release/moo-compiler compile \
            beispiele/domain/game/world/welt_test.moos --emit-ir -o /tmp/welt_test.ll
          test -s /tmp/welt_test.ll

      - name: Moo-Compile welt_test.moos → Binary (Linker-Smoke)
        env:
          MOO_3D_BACKEND: ${{ matrix.backend }}
        run: |
          ./compiler/target/release/moo-compiler compile \
            beispiele/domain/game/world/welt_test.moos -o /tmp/welt_test
          test -x /tmp/welt_test

      # Headful-Run + Screenshot-Hash-Vergleich kommt in Phase 2
      # (braucht Xvfb + Baseline pro Backend).
