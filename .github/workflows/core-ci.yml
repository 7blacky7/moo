name: Core Test Suite

# Vollstaendige sprach-/runtime-nahe Tests ohne Fenster, Xvfb oder GPU-Lauf.
# Ubuntu, Windows und macOS sind verbindliche Gates. Plattformfehler duerfen
# nicht durch continue-on-error als erfolgreiche Core-Suite erscheinen.
on:
  push:
    paths:
      - ".github/workflows/core-ci.yml"
      - ".cargo/**"
      - "compiler/.cargo/**"
      - "compiler/Cargo.toml"
      - "compiler/Cargo.lock"
      - "compiler/build.rs"
      - "compiler/build_aritaet.rs"
      - "compiler/src/**"
      - "compiler/runtime/**"
      # build.rs kann auf Nicht-Windows-Hosts auch das MinGW-Archiv bauen.
      - "skripte/p2/windows_minipc/runtime_mingw.sh"
      - "skripte/p2/windows_minipc/db_abwesend.c"
      - "compiler/tests/**"
      - "stdlib/**"
      # run_all.sh und die zusaetzlichen Core-Gates verwenden diese Eingaben.
      - "scripts/game-test-runner.sh"
      - "skripte/p2/ffi/klein_roundtrip.sh"
      - "skripte/p2/abi/aarch64_struct_slice.sh"
      - "skripte/p2/abi/struct_by_value.c"
      - "skripte/p2/abi/struct_by_value.h"
      - "skripte/p7/lader/system_ffi_struct.moos"
      - "scripts/kernel-smoke.sh"
      - "beispiele/kernel/hallo_kern.moos"
      - "skripte/p2/zahlen/**"
      - "beispiele/kernel/netz_tcp.moos"
      - "skripte/p2/runtime/rc_geteilt_stress.sh"
      - "beispiele/snake_plus_selftest.moos"
      - "beispiele/domain/game/world/siedler3_selftest.moos"
      - "beispiele/voxel_sandbox_selftest.moos"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: ${{ matrix.os }} / run_all.sh
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            arch: X64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            arch: X64
          - os: macos-latest
            target: aarch64-apple-darwin
            arch: ARM64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Matrix contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$RUNNER_ARCH" = "${{ matrix.arch }}"
          echo "OS=${{ matrix.os }}"
          echo "TARGET=${{ matrix.target }}"

      - name: Install Ubuntu core dependencies
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          # LLVM 22 aus apt.llvm.org (Ubuntu liefert nur bis 18/19/20).
          . /etc/os-release
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/${VERSION_CODENAME}/ llvm-toolchain-${VERSION_CODENAME}-22 main" | sudo tee /etc/apt/sources.list.d/llvm-22.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y \
            clang-22 lld-22 llvm-22-dev libpolly-22-dev libclang-22-dev \
            libgtk-3-dev libappindicator3-dev \
            libglfw3-dev libgl1-mesa-dev libvulkan-dev glslang-tools \
            libsdl2-dev libsdl2-image-dev \
            libsqlite3-dev libssl-dev pkg-config python3 ripgrep \
            qemu-system-x86 grub-common grub-pc-bin xorriso
          echo "LLVM_SYS_221_PREFIX=/usr/lib/llvm-22" >> "$GITHUB_ENV"
          echo "LLVM_SYS_221_STRICT_VERSIONING=1" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=/usr/lib/llvm-22/lib" >> "$GITHUB_ENV"

      - name: Install Windows LLVM
        if: matrix.os == 'windows-latest'
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: moo-llvm
          create-args: >-
            -c conda-forge
            llvmdev=22.1.*
            clangdev=22.1.*
            lld=22.1.*
            zstd
            zlib
            libxml2
            libxml2-devel
          cache-environment: true

      - name: Configure MSVC developer environment
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Windows core dependencies
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $condaPrefix = $env:CONDA_PREFIX
          if (!$condaPrefix) {
            $condaPrefix = Join-Path $env:MAMBA_ROOT_PREFIX "envs\moo-llvm"
          }
          if (!(Test-Path $condaPrefix)) {
            throw "moo-llvm conda environment fehlt: $condaPrefix"
          }
          $llvmRoot = Join-Path $condaPrefix "Library"
          $llvmBin = Join-Path $llvmRoot "bin"
          $llvmConfig = Join-Path $llvmBin "llvm-config.exe"
          $clang = Join-Path $llvmBin "clang.exe"
          $lld = Join-Path $llvmBin "lld-link.exe"
          foreach ($required in @($llvmConfig, $clang, $lld)) {
            if (!(Test-Path $required)) { throw "LLVM-Pflichtdatei fehlt: $required" }
          }
          & $llvmConfig --version

          vcpkg install --triplet x64-windows `
            sdl2 sdl2-image sqlite3 glfw3 vulkan
          $vcpkgRoot = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows"
          $condaLib = Join-Path $llvmRoot "lib"

          foreach ($paar in @(@("zstd.lib","zstd.dll.lib"), @("zlib.lib","z.dll.lib"))) {
            $quelle = Join-Path $condaLib $paar[0]
            $ziel = Join-Path $condaLib $paar[1]
            if ((Test-Path $quelle) -and !(Test-Path $ziel)) { Copy-Item $quelle $ziel }
          }

          $msvcBin = Join-Path $env:VCToolsInstallDir "bin\HostX64\x64"
          $msvcLink = Join-Path $msvcBin "link.exe"
          if (!(Test-Path $msvcLink)) { throw "MSVC link.exe fehlt: $msvcLink" }

          "LLVM_SYS_221_PREFIX=$llvmRoot" >> $env:GITHUB_ENV
          "LLVM_SYS_221_STRICT_VERSIONING=1" >> $env:GITHUB_ENV
          "LIBCLANG_PATH=$llvmBin" >> $env:GITHUB_ENV
          "CFLAGS_x86_64_pc_windows_msvc=/std:c11" >> $env:GITHUB_ENV
          "MOO_CLANG=$clang" >> $env:GITHUB_ENV
          "MOO_LLD=$lld" >> $env:GITHUB_ENV
          "VCPKGRS_DYNAMIC=1" >> $env:GITHUB_ENV
          "INCLUDE=$llvmRoot\include;$vcpkgRoot\include;$env:INCLUDE" >> $env:GITHUB_ENV
          "LIB=$condaLib;$vcpkgRoot\lib;$env:LIB" >> $env:GITHUB_ENV
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$msvcLink" >> $env:GITHUB_ENV
          "PATH=$llvmBin;$vcpkgRoot\bin;$msvcBin;$env:PATH" >> $env:GITHUB_ENV

      - name: Install macOS core dependencies
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          brew update
          brew install bash llvm@22 sdl2 sdl2_image glfw vulkan-loader openssl@3
          # Beide Testskripte verwenden assoziative Arrays (Bash >= 4).
          echo "$(brew --prefix bash)/bin" >> "$GITHUB_PATH"
          LLVM_PREFIX="$(brew --prefix llvm@22)"
          "$LLVM_PREFIX/bin/llvm-config" --host-target
          SDL2_PREFIX="$(brew --prefix sdl2)"
          SDL2_IMAGE_PREFIX="$(brew --prefix sdl2_image)"
          GLFW_PREFIX="$(brew --prefix glfw)"
          VULKAN_PREFIX="$(brew --prefix vulkan-loader)"
          VULKAN_HEADERS_PREFIX="$(brew --prefix vulkan-headers)"
          OPENSSL_PREFIX="$(brew --prefix openssl@3)"
          echo "LLVM_SYS_221_PREFIX=$LLVM_PREFIX" >> "$GITHUB_ENV"
          echo "LLVM_SYS_221_STRICT_VERSIONING=1" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$LLVM_PREFIX/lib" >> "$GITHUB_ENV"
          echo "CPATH=$SDL2_PREFIX/include:$SDL2_PREFIX/include/SDL2:$SDL2_IMAGE_PREFIX/include:$SDL2_IMAGE_PREFIX/include/SDL2:$GLFW_PREFIX/include:$VULKAN_HEADERS_PREFIX/include:$OPENSSL_PREFIX/include:${CPATH:-}" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$SDL2_PREFIX/lib:$SDL2_IMAGE_PREFIX/lib:$GLFW_PREFIX/lib:$VULKAN_PREFIX/lib:$OPENSSL_PREFIX/lib:${LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$SDL2_PREFIX/lib/pkgconfig:$SDL2_IMAGE_PREFIX/lib/pkgconfig:$GLFW_PREFIX/lib/pkgconfig:$VULKAN_PREFIX/lib/pkgconfig:$OPENSSL_PREFIX/lib/pkgconfig:$LLVM_PREFIX/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS=-I$SDL2_PREFIX/include -I$SDL2_PREFIX/include/SDL2 -I$SDL2_IMAGE_PREFIX/include -I$SDL2_IMAGE_PREFIX/include/SDL2 -I$GLFW_PREFIX/include -I$VULKAN_HEADERS_PREFIX/include -I$OPENSSL_PREFIX/include" >> "$GITHUB_ENV"
          echo "MACOSX_DEPLOYMENT_TARGET=$(sw_vers -productVersion | cut -d. -f1).0" >> "$GITHUB_ENV"

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            compiler/target
          key: ${{ runner.os }}-core-${{ hashFiles('compiler/Cargo.toml', 'compiler/Cargo.lock', 'compiler/build.rs') }}
          restore-keys: |
            ${{ runner.os }}-core-

      - name: Build MSVC refcount and thread branches
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $cl = Join-Path $env:VCToolsInstallDir "bin\HostX64\x64\cl.exe"
          if (!(Test-Path $cl)) { throw "Microsoft cl.exe fehlt: $cl" }
          $out = Join-Path $env:GITHUB_WORKSPACE "build\p2-msvc-zweige"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          foreach ($name in @("moo_memory", "moo_thread")) {
            $source = "compiler\runtime\$name.c"
            $object = Join-Path $out "$name.obj"
            & $cl /nologo /Bv /std:c11 /O2 /Gy /W4 /D_CRT_SECURE_NO_WARNINGS /D_CRT_NONSTDC_NO_DEPRECATE /Icompiler/runtime /c $source "/Fo$object"
            if ($LASTEXITCODE -ne 0) { throw "MSVC-Bau fehlgeschlagen: $source" }
            if (!(Test-Path $object)) { throw "MSVC-Objekt fehlt: $object" }
          }
          $probeSource = "compiler\runtime\tests\test_rc_thread_kennung.c"
          $probeObject = Join-Path $out "test_rc_thread_kennung.obj"
          $probeExe = Join-Path $out "test_rc_thread_kennung.exe"
          $threadObject = Join-Path $out "moo_thread.obj"
          & $cl /nologo /std:c11 /O2 /W4 /D_CRT_SECURE_NO_WARNINGS /D_CRT_NONSTDC_NO_DEPRECATE /Icompiler/runtime $probeSource $threadObject "/Fo$probeObject" "/Fe$probeExe" /link /OPT:REF kernel32.lib
          if ($LASTEXITCODE -ne 0) { throw "MSVC-Link des RC-/Thread-Vertragstests fehlgeschlagen" }
          & $probeExe
          if ($LASTEXITCODE -ne 0) { throw "MSVC RC-/Thread-Vertragstest fehlgeschlagen" }
          Get-FileHash -Algorithm SHA256 compiler/runtime/moo_rc.h,compiler/runtime/moo_memory.c,compiler/runtime/moo_thread.c,compiler/runtime/tests/test_rc_thread_kennung.c
          Get-FileHash -Algorithm SHA256 "$out\moo_memory.obj","$out\moo_thread.obj"
          Write-Output "MOO_MSVC_RC_THREAD_BUILD_PASS"

      - name: Run complete core suite
        shell: bash
        run: |
          set -euo pipefail
          printf 'BASH_VERSION=%s\n' "$BASH_VERSION"
          if (( BASH_VERSINFO[0] < 4 )); then
            echo 'Core-Tests brauchen Bash >= 4' >&2; exit 2
          fi
          bash compiler/tests/run_all.sh 2>&1 | tee "core-ci-${{ runner.os }}.log"
          grep -F 'Ergebnis:' "core-ci-${{ runner.os }}.log"

      - name: Record native platform evidence
        shell: bash
        run: |
          set -euo pipefail
          native_host="$(rustc -vV | tr -d '\r' | awk '$1 == "host:" {print $2}')"
          test "$native_host" = "${{ matrix.target }}"
          native_compiler="${CARGO_TARGET_DIR:-compiler/target}/release/moo-compiler"
          checksum=(sha256sum)
          case "$RUNNER_OS" in
            Windows) native_compiler+=.exe ;;
            macOS) checksum=(shasum -a 256) ;;
          esac
          {
            printf 'SOURCE_SHA=%s\n' "$GITHUB_SHA"
            printf 'RUNNER=%s/%s IMAGE=%s/%s\n' "$RUNNER_OS" "$RUNNER_ARCH" "${ImageOS:-}" "${ImageVersion:-}"
            printf 'RUN_ID=%s ATTEMPT=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            rustc -vV
            "${checksum[@]}" "$native_compiler" "core-ci-$RUNNER_OS.log"
          } | tee "p2-native-platform-$RUNNER_OS.log"

      - name: Install mise for native bit and crypto contracts
        if: matrix.os == 'ubuntu-latest'
        uses: jdx/mise-action@v2

      - name: Check native bit and crypto contracts
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$LLVM_SYS_221_PREFIX/bin:$PATH"
          export MOO_COMPILER="$GITHUB_WORKSPACE/compiler/target/release/moo-compiler"
          mise -C skripte/p2/zahlen run bitops 2>&1 | tee p125-bits-ci.log
          mise -C skripte/p2/zahlen run crypto 2>&1 | tee p125-crypto-ci.log
          mise -C skripte/p2/zahlen run tcp-sequenz 2>&1 | tee p125-tcp-ci.log
          mise -C skripte/p2/zahlen run modulo-codegen 2>&1 | tee p127-modulo-ci.log


      - name: Check Linux native C ABI and verify LLVM IR
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$LLVM_SYS_221_PREFIX/bin:$PATH"
          P2_COMPILER="$GITHUB_WORKSPACE/compiler/target/release/moo-compiler" \
            bash skripte/p2/ffi/klein_roundtrip.sh 2>&1 | tee p2-native-abi-linux.log
          opt -passes=verify -disable-output build/p2-ffi-klein-roundtrip/probe.ll
          echo 'LLVM verify: native Linux ABI IR' | tee -a p2-native-abi-linux.log

      - name: Check AArch64 cross ABI and verify LLVM IR
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$LLVM_SYS_221_PREFIX/bin:$PATH"
          bash skripte/p2/abi/aarch64_struct_slice.sh \
            "$GITHUB_WORKSPACE/compiler/target/release/moo-compiler" 2>&1 | tee p2-aarch64-cross.log
          grep -F 'PASS AArch64 Moo->C' p2-aarch64-cross.log

      - name: Check x86_64 bare QEMU boot
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          MOO_BIN="$GITHUB_WORKSPACE/compiler/target/release/moo-compiler" \
            bash scripts/kernel-smoke.sh 2>&1 | tee p2-bare-qemu.log
          grep -Fx '# ERGEBNIS: ALLE 4 Phasen gruen.' p2-bare-qemu.log

      - name: Check failed system thread starts
        shell: bash
        run: |
          set -euo pipefail
          # Cargo nennt das tatsaechlich verwendete Build-Verzeichnis, auch aus dem Cache.
          mkdir -p build
          cargo build --manifest-path compiler/Cargo.toml --release --message-format=json \
            > build/thread-start-cargo.json
          thread_out_dir="$(jq -sr '[.[] | select(.reason == "build-script-executed" and (.package_id | contains("moo-compiler"))) | .out_dir] | unique | if length == 1 then .[0] else error("Runtime-Build-Verzeichnis nicht eindeutig") end' build/thread-start-cargo.json)"
          case "$RUNNER_OS" in
            Windows) thread_lib=moo_runtime.lib ;;
            *) thread_lib=libmoo_runtime.a ;;
          esac
          MOO_RUNTIME_LIB="$thread_out_dir/$thread_lib" \
            RC_THREAD_START_TEST=1 RC_STRESS_PROGRAMME=thread_start_fehler \
            bash skripte/p2/runtime/rc_geteilt_stress.sh \
            compiler/target/release/moo-compiler build/p2-thread-start-ci 1 systemfehler \
            2>&1 | tee "thread-start-ci-${{ runner.os }}.log"
          tr -d '\r' < "thread-start-ci-${{ runner.os }}.log" \
            | grep -Fx 'thread_start_fehler systemfehler korrekt=1/1'

      - name: Check Darwin scalar C FFI
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          P2_COMPILER="$GITHUB_WORKSPACE/compiler/target/release/moo-compiler" \
            bash skripte/p2/ffi/klein_roundtrip.sh 2>&1 | tee ffi-darwin-ci.log
          grep -Fx 'i8/u8/bool nativer C-Roundtrip und Typnegative: PASS' ffi-darwin-ci.log

      - name: Upload core-suite log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-ci-${{ runner.os }}-${{ github.run_attempt }}
          path: |
            core-ci-${{ runner.os }}.log
            p2-native-platform-${{ runner.os }}.log
            p2-native-abi-linux.log
            p2-aarch64-cross.log
            p2-bare-qemu.log
            build/p2/aarch64-ffi/file-headers.txt
            build/p2-msvc-zweige/
            thread-start-ci-${{ runner.os }}.log
            ffi-darwin-ci.log
            build/p2-ffi-klein-roundtrip/*.log
            build/p2-thread-start-ci/*.compile.log
            build/p2-thread-start-ci/err.txt
          if-no-files-found: warn
          retention-days: 14
